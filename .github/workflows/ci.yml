name: Linux virtual iPhone app build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: aarch64-apple-ios
      - name: Build native voice library
        run: |
          cargo build --locked -p nanocodex-voice-ffi --release --target aarch64-apple-ios
          mkdir -p apple/NanocodexVoice/Artifacts
          xcodebuild -create-xcframework -library target/aarch64-apple-ios/release/libnanocodex_voice_ffi.a -headers crates/nanocodex-voice-ffi/include -output apple/NanocodexVoice/Artifacts/NanocodexVoiceCore.xcframework
      - name: Build ARM64 device app for Linux research guest
        run: |
          xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath output/arm64 -jobs 3 CODE_SIGNING_ALLOWED=NO build > output-device-build.log 2>&1
          app=output/arm64/Build/Products/Debug-iphoneos/Nanocodex.app
          test -d "$app"
          codesign --force --deep --sign - "$app"
          mkdir -p output/package/Payload
          cp -R "$app" output/package/Payload/
          cd output/package
          ditto -c -k --keepParent Payload Nanocodex-research-arm64.ipa
          shasum -a 256 Nanocodex-research-arm64.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-inferno-arm64-app
          path: |
            output/package/*.ipa
            output/package/SHA256SUMS
            output-device-build.log
