name: Native Binaryen
description: >-
  Install the native wasm-opt matching the pinned npm binaryen package. The npm
  package runs Binaryen compiled to JavaScript (~100-130 s for the release -Oz
  pass); the native release emits byte-identical output in ~16 s.
  build-js-package.sh uses it only when its --version matches the package.
runs:
  using: composite
  steps:
    - name: Install native wasm-opt
      if: runner.os == 'Linux' && runner.arch == 'X64'
      # A failed download only loses the speedup; the npm package still builds.
      continue-on-error: true
      shell: bash
      env:
        # Keep in sync with js/nanocodex/package.json devDependencies.binaryen.
        BINARYEN_VERSION: "132"
        BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
      run: |
        dir="$RUNNER_TEMP/binaryen"
        archive="$dir/binaryen.tar.gz"
        mkdir -p "$dir"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
          --output "$archive" \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        echo "$BINARYEN_SHA256  $archive" | sha256sum --check --quiet -
        tar -xzf "$archive" -C "$dir" "binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt"
        rm "$archive"
        wasm_opt="$dir/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt"
        "$wasm_opt" --version
        echo "NANOCODEX_WASM_OPT=$wasm_opt" >> "$GITHUB_ENV"
