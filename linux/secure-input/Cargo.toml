[package]
name = "nanocodex-secure-input-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
build = "build.rs"

# Deliberately isolated from the large application graph. Enrollment and setuid
# distribution must not implicitly run through an agent tool or application build.
[workspace]

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# aes-gcm/zeroize only scrubs its temporary GHASH key. Explicit feature
# unification also enables AES schedules and POLYVAL state Drop scrubbing.
aes = { version = "0.8.4", features = ["zeroize"] }
ghash = { version = "0.5.1", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
base64 = "0.22.1"
hkdf = "0.12.4"
libc = "0.2"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[build-dependencies]
cc = "1"

[[bin]]
name = "nanocodex-secure-input"
path = "src/main.rs"

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
